# MNIST MLP Training Configuration
model:
  hidden_dims: [784, 1024, 512, 256, 10]
  activation: relu
  dropout: 0.1
  use_layernorm: true

training:
  batch_size: 256
  epochs: 15
  learning_rate: 0.001
  weight_decay: 0.0001

benchmark:
  warmup_steps: 5
  measure_steps: 20
  inference_warmup: 10
  inference_measure: 50

output:
  results_dir: results
  save_checkpoint: false

seed: 42
