# Benchmark 配置: 控制所有 benchmark 运行的 shape / dtype / implementation
#
# 用法:
#   python bench/benchmark.py --config bench/benchmark_shapes.yaml
#   python bench/benchmark.py --impl cuda_tiled --dtype fp16 --M 1024 --K 4096 --N 11008

# BERT-like shapes
bert_like:
  M: [128, 512, 2048]
  K: [768]
  N: [3072]

# Llama/Qwen-like shapes
llm_like:
  M: [128, 512, 2048]
  K: [4096]
  N: [11008]

# 小显存友好
small_gpu:
  M: [128, 256, 512]
  K: [1024]
  N: [4096]

# 快速测试用
quick_test:
  M: [128]
  K: [1024]
  N: [4096]

# dtype 选择
dtypes:
  - fp32
  - fp16

# 要 benchmark 的实现
implementations:
  - torch
  # - cuda_naive        # 取消注释以启用
  # - cuda_tiled
  # - cuda_fused
  # - triton_matmul
  # - triton_mlp

# benchmark 参数
benchmark_params:
  warmup: 20
  repeat: 100
  seed: 42
